<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Nederlands Leer Studio</title>
<style>
:root{--bg:#f5f8fc;--panel:#fff;--ink:#14305b;--muted:#6c7b90;--line:#dfe7ef;--blue:#2e69d5;--green:#48b780;--orange:#ef7b2e;--shadow:0 10px 28px rgba(27,59,102,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-rounded,"Arial Rounded MT Bold","Noto Sans KR",system-ui,-apple-system,sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.shell{min-height:100vh}
.sidebar{display:none}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px}
.top-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:950;min-width:0}.brand span{white-space:nowrap}.brand-icon{font-size:26px}
.controls{display:flex;gap:6px;align-items:center}.chipbtn{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;color:var(--ink)}.chipbtn.active{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f1f6ff}
.theme-row{display:flex;gap:7px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.theme-row::-webkit-scrollbar{display:none}.theme-row .chipbtn{white-space:nowrap;flex:0 0 auto}
main{padding:12px 12px 92px}

function renderLevels(){
 const box=$("#levels");box.innerHTML="";
 Object.entries(levelData).forEach(([k,v])=>{const n=levelNames[k],b=document.createElement("button");b.className="level"+(k===level?" active":"");b.innerHTML=`<img src="${v.img}" alt=""><b>${k}</b><small>${n[0]}</small><small>${lang==="ko"?n[1]:n[2]}</small>`;b.onclick=()=>{level=k;localStorage.setItem("nl_level",k);renderLevels();renderLesson()};box.appendChild(b)})
}
function renderTopics(){
 const box=$("#topics");box.innerHTML="";
 topicData.forEach(t=>{const b=document.createElement("button");b.className="topic";b.innerHTML=`<img src="${t[4]}" alt=""><b>${lang==="ko"?t[1]:t[2]}</b><small>${t[3]}</small>`;b.onclick=()=>openTopic(lang==="ko"?t[1]:t[2]);box.appendChild(b)})
}
function renderLesson(){
 const x=lessonCopy[level];$("#lessonNum").textContent=`Lesson ${level}`;$("#lessonTitle").textContent=x[0];$("#lessonDesc").textContent=lang==="ko"?x[1]:x[2];$("#prog").style.width=localStorage.getItem("done_"+level)==="1"?"100%":"60%";
}
function applyLang(){
 document.documentElement.lang=lang;$$("[data-ko][data-en]").forEach(n=>n.textContent=n.dataset[lang]);$$(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("nl_lang",lang);renderLevels();renderTopics();renderLesson()
}
function applyTheme(){
 document.body.classList.remove("scenery","modern","windmill");if(theme!=="3d")document.body.classList.add(theme);$$(".theme").forEach(b=>b.classList.toggle("active",b.dataset.theme===theme));const hero=$("#hero");hero.style.backgroundPosition=theme==="windmill"?"82% center":theme==="modern"?"35% center":theme==="scenery"?"55% center":"center";localStorage.setItem("nl_theme",theme)
}
function modal(html){$("#modalBody").innerHTML=html;$("#modalWrap").classList.remove("hidden")}
function closeModal(){$("#modalWrap").classList.add("hidden")}
function speak(t,r=.72){if(!("speechSynthesis" in window)){alert(lang==="ko"?"이 브라우저에서는 음성을 지원하지 않습니다.":"Speech is not supported in this browser.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";u.rate=r;speechSynthesis.speak(u)}
function openLesson(){const x=lessonCopy[level];modal(`<h2>${x[0]}</h2><p>${lang==="ko"?x[1]:x[2]}</p><button class="primary" id="hear">🔊 ${lang==="ko"?"예문 듣기":"Listen"}</button><button class="primary" id="finish">${lang==="ko"?"학습 완료":"Complete lesson"}</button>`);$("#hear").onclick=()=>speak("Goedemorgen! Ik wil graag een koffie, alstublieft.");$("#finish").onclick=()=>{localStorage.setItem("done_"+level,"1");renderLesson();closeModal()}}
function openListening(){modal(`<h2>🎧 Slow Listening</h2><p>${lang==="ko"?"느린 속도와 자연 속도로 들어보세요.":"Listen at slow and natural speed."}</p><p><b>Ik woon in Utrecht en ik ga met de fiets naar mijn werk.</b></p><button class="primary" id="slow">🐢 Slow</button><button class="primary" id="normal">▶ Normal</button>`);$("#slow").onclick=()=>speak("Ik woon in Utrecht en ik ga met de fiets naar mijn werk.",.58);$("#normal").onclick=()=>speak("Ik woon in Utrecht en ik ga met de fiets naar mijn werk.",.9)}
function openWriting(){modal(`<h2>📝 Writing Lab</h2><p>${lang==="ko"?"오늘 하루를 네덜란드어 세 문장으로 써보세요.":"Write three Dutch sentences about your day."}</p><textarea id="writing" class="field" rows="7" placeholder="Ik sta om...">${localStorage.getItem("nl_writing")||""}</textarea><button id="saveWriting" class="primary">${lang==="ko"?"저장":"Save"}</button>`);$("#saveWriting").onclick=()=>{localStorage.setItem("nl_writing",$("#writing").value);alert(lang==="ko"?"저장했습니다.":"Saved.")}}
function openProfile(){const p=JSON.parse(localStorage.getItem("nl_profile")||"null");modal(`<h2>${lang==="ko"?"내 프로필":"My profile"}</h2><input id="pname" class="field" value="${p?.name||""}" placeholder="${lang==="ko"?"이름 / 닉네임":"Name / nickname"}"><input id="pin" class="field" type="password" maxlength="12" placeholder="${lang==="ko"?"개인 코드 4자리 이상":"Personal code, 4+ characters"}"><button id="saveProfile" class="primary">${lang==="ko"?"저장":"Save"}</button>`);$("#saveProfile").onclick=()=>{const name=$("#pname").value.trim(),pin=$("#pin").value;if(!name||pin.length<4){alert(lang==="ko"?"이름과 4자리 이상의 코드를 입력하세요.":"Enter a name and a 4+ character code.");return}localStorage.setItem("nl_profile",JSON.stringify({name}));$("#sideHello").textContent="Hallo, "+name+"!";closeModal()}}
function openTopic(name){modal(`<h2>${name}</h2><p>${lang==="ko"?level+" 수준에 맞춰 이 주제를 학습합니다.":"Practice this topic at "+level+" level."}</p><button class="primary" id="topicGo">${lang==="ko"?"시작하기":"Start"}</button>`)}
function initProfile(){const p=JSON.parse(localStorage.getItem("nl_profile")||"null");if(p)$("#sideHello").textContent="Hallo, "+p.name+"!"}

$$(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});
$$(".theme").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;applyTheme()});
$$(".sound").forEach(b=>b.onclick=()=>speak(b.dataset.say,.6));
$("#continueBtn").onclick=openLesson;$("#listenBtn").onclick=openListening;$("#sideListen").onclick=openListening;$("#writeBtn").onclick=openWriting;$("#sideWrite").onclick=openWriting;$("#profileBtn").onclick=openProfile;
$("#mLessons").onclick=()=>document.querySelector(".card").scrollIntoView({behavior:"smooth"});$("#mListen").onclick=openListening;$("#mWrite").onclick=openWriting;$("#mProfile").onclick=openProfile;
$("#closeModal").onclick=closeModal;$("#modalWrap").onclick=e=>{if(e.target===$("#modalWrap"))closeModal()};
applyTheme();applyLang();initProfile();
</script>
</body>
